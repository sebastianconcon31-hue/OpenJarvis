# Starts the bot plus Caddy, which gets a free HTTPS certificate automatically.
# On the server:  docker compose up -d --build
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./salon.yaml:/app/salon.yaml:ro
      - ./data:/app/data
      - ./google-credentials.json:/app/google-credentials.json:ro
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
