    - "Mi avvisate se annullate voi?"
  q_en:
    - "What if the barber cancels?"
  a_it: "Se per qualsiasi motivo dovessimo spostare il suo appuntamento, la avvisiamo qui su WhatsApp il prima possibile."
  a_en: "If we ever need to move your appointment, we'll let you know here on WhatsApp as soon as possible."

- id: maleducazione
  cat: regole
  q_it:
    - "Siete aperti a tutti?"
    - "Accogliete tutti?"
  q_en:
