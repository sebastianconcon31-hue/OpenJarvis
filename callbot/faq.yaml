    - "Delete my data"
  a_it: "Usiamo il suo numero solo per gli appuntamenti e i promemoria. Se vuole che cancelliamo i suoi dati, avviso il titolare che se ne occupa."
  a_en: "We only use your number for appointments and reminders. If you want your data deleted, I'll ask the owner to take care of it."
  handoff: true

