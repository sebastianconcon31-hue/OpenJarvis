    - "Can I take photos?"
  a_it: "Le foto si fanno solo con il suo permesso: se le fa piacere, lo dica pure al barbiere."
  a_en: "Photos are only taken with your permission: if you'd like one, just tell the barber."

- id: annullamento_salone
  cat: regole
  q_it:
