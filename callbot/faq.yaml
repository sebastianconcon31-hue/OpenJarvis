# ---------------------------------------------------------------------------
# The 150 questions customers ask barbers most often, with answers in Italian
# and English. The bot looks these up with its search_faq tool.
#
# How the list was made: there is no published "top 150" study, so the
# questions were gathered from real barbershop FAQ pages, booking-app guides
# and customer reviews, then grouped and translated for an Italian salon.
#
# Placeholders in {curly braces} are filled in automatically:
#   {name} {address} {hours} {prices} {services} {barbers} {max_days} {min_notice}
#   come from salon.yaml. Anything else, like {parking}, comes from the
#   "facts:" section of salon.yaml. If a fact is empty, the bot does NOT guess:
#   it says it will check, and passes the chat to the owner.
# "needs" lists the facts an answer depends on.
# ---------------------------------------------------------------------------

# ===================== 1. PRENOTAZIONI / BOOKING (25) =====================
- id: come_prenotare
  cat: prenotazioni
  q_it:
    - "Come posso prenotare?"
    - "Posso prendere un appuntamento?"
    - "Si prenota qui su WhatsApp?"
  q_en:
    - "How do I book?"
    - "Can I make an appointment?"
  a_it: "Può prenotare direttamente qui su WhatsApp: mi dica il servizio e il giorno che preferisce e le propongo gli orari liberi."
  a_en: "You can book right here on WhatsApp: tell me the service and the day you'd like and I'll suggest the free times."

