    - "Are blades single-use?"
  a_it: "Sì, gli attrezzi vengono puliti e disinfettati dopo ogni cliente, e le lamette dei rasoi sono monouso."
  a_en: "Yes, tools are cleaned and disinfected after every client, and razor blades are single-use."

