  a_it: "Certo, da noi sono tutti i benvenuti."
  a_en: "Of course, everyone is welcome here."

- id: covid_malato
  cat: regole
  q_it:
    - "Ho la febbre, posso venire?"
    - "Sono raffreddato, devo disdire?"
  q_en:
    - "I'm sick, should I still come?"
  a_it: "Se non sta bene, meglio riposarsi: le sposto volentieri l'appuntamento a un altro giorno."
  a_en: "If you're unwell, better rest: I'll happily move your appointment to another day."

- id: puntualita_salone
  cat: regole
  q_it:
    - "Siete puntuali?"
    - "Rispettate gli orari degli appuntamenti?"
  q_en:
    - "Do you run on time?"
  a_it: "Cerchiamo sempre di rispettare gli orari: per questo lavoriamo su appuntamento."
  a_en: "We always try to stay on schedule: that's why we work by appointment."

