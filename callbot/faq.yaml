# ===================== 7. CONSIGLI SUI CAPELLI / HAIR ADVICE (30) =====================
- id: ogni_quanto_taglio
  cat: consigli
  q_it:
    - "Ogni quanto devo tagliare i capelli?"
    - "Ogni quanto si fa il taglio?"
    - "Quanto spesso devo venire?"
  q_en:
    - "How often should I get a haircut?"
  a_it: "Per tagli corti e sfumature, ogni 2-4 settimane; per tagli medi ogni 4-6 settimane; per capelli lunghi ogni 6-10 settimane."
  a_en: "For short cuts and fades, every 2-4 weeks; medium cuts every 4-6 weeks; long hair every 6-10 weeks."

- id: durata_sfumatura
  cat: consigli
  q_it:
    - "Quanto dura una sfumatura?"
    - "Dopo quanto si rovina il fade?"
  q_en:
    - "How long does a fade last?"
  a_it: "Una sfumatura resta bella circa 1-2 settimane; dopo 3 settimane di solito ha bisogno di una ripassata."
  a_en: "A fade looks sharp for about 1-2 weeks; after around 3 weeks it usually needs a touch-up."

- id: viso_tondo
  cat: consigli
  q_it:
    - "Che taglio sta bene con il viso tondo?"
    - "Ho il viso rotondo"
  q_en:
    - "What cut suits a round face?"
  a_it: "Con il viso tondo stanno bene i tagli con volume in alto e lati corti (sfumatura, quiff, pompadour): allungano il viso."
  a_en: "Round faces suit volume on top with short sides (fade, quiff, pompadour): they make the face look longer."

- id: viso_lungo
  cat: consigli
  q_it:
    - "Che taglio per viso lungo?"
    - "Ho la faccia allungata"
  q_en:
    - "What cut suits a long face?"
  a_it: "Con il viso lungo meglio evitare troppo volume in alto: stanno bene frangia, crop o lati non troppo corti."
  a_en: "With a long face, avoid too much height on top: fringes, crops or sides that aren't too short work well."

- id: viso_quadrato
  cat: consigli
  q_it:
    - "Che taglio per viso quadrato?"
    - "Ho la mascella larga"
  q_en:
    - "What suits a square face?"
  a_it: "Il viso quadrato sta bene con quasi tutto: tagli corti classici, crew cut o undercut valorizzano la mascella."
  a_en: "A square face suits almost anything: classic short cuts, crew cuts or undercuts show off the jawline."

- id: viso_ovale
  cat: consigli
  q_it:
    - "Che taglio per viso ovale?"
  q_en:
    - "What suits an oval face?"
  a_it: "Il viso ovale è il più versatile: può provare quasi ogni taglio, dal corto al medio-lungo."
  a_en: "An oval face is the most versatile: you can try almost any cut, from short to medium-long."

- id: capelli_fini
  cat: consigli
  q_it:
    - "Ho i capelli fini, che taglio faccio?"
    - "Come do volume ai capelli sottili?"
  q_en:
    - "I have fine hair, what cut?"
    - "How to add volume?"
  a_it: "Per capelli fini funzionano tagli corti e scalati, con un po' di texture in alto e un prodotto opaco (polvere o argilla) per dare volume."
  a_en: "Fine hair works well with short, textured cuts and a matte product (powder or clay) for volume."

- id: capelli_spessi
  cat: consigli
  q_it:
    - "Ho i capelli grossi e tanti"
    - "Ho troppi capelli, come li sfoltisco?"
  q_en:
    - "I have thick hair, can you thin it?"
  a_it: "Con capelli spessi il barbiere può sfoltire e scalare per togliere peso; una sfumatura ai lati aiuta molto."
  a_en: "With thick hair the barber can thin and layer to remove bulk; faded sides help a lot."

- id: diradamento
  cat: consigli
  q_it:
    - "Sto perdendo i capelli, che taglio faccio?"
    - "Ho la stempiatura"
    - "Ho un diradamento"
  q_en:
    - "I'm losing my hair, what cut?"
    - "Receding hairline"
  a_it: "Con stempiatura o diradamento di solito stanno meglio tagli corti e ordinati (crop, buzz cut, sfumatura): rendono meno visibili le zone più rade. Per la caduta, meglio sentire un dermatologo."
  a_en: "With a receding or thinning hairline, short neat cuts (crop, buzz cut, fade) usually look best and make thin areas less visible. For hair loss itself, see a dermatologist."

- id: capelli_bianchi
  cat: consigli
  q_it:
    - "Ho i capelli bianchi, li copro?"
    - "Capelli grigi, che faccio?"
  q_en:
    - "Should I cover my grey hair?"
  a_it: "Il grigio curato oggi va molto: un taglio ordinato lo valorizza. Se preferisce coprirlo: {colour}"
  a_en: "Well-kept grey looks great today: a neat cut shows it off. If you'd rather cover it: {colour}"
  needs: [colour]

- id: forfora
  cat: consigli
  q_it:
    - "Ho la forfora, cosa faccio?"
    - "Mi prude la testa"
  q_en:
    - "I have dandruff, what should I do?"
  a_it: "Uno shampoo antiforfora usato 2-3 volte a settimana di solito aiuta. Se dura o la pelle è arrossata, meglio sentire un dermatologo."
  a_en: "An anti-dandruff shampoo 2-3 times a week usually helps. If it persists or the scalp is red, see a dermatologist."

- id: lavare_capelli
  cat: consigli
  q_it:
    - "Ogni quanto devo lavare i capelli?"
    - "Lavo i capelli tutti i giorni, va bene?"
  q_en:
    - "How often should I wash my hair?"
  a_it: "Per la maggior parte delle persone, 2-4 volte a settimana va bene. Se li lava ogni giorno, scelga uno shampoo delicato."
  a_en: "For most people 2-4 times a week is fine. If you wash daily, choose a gentle shampoo."

- id: prodotto_styling
  cat: consigli
  q_it:
    - "Che prodotto devo usare?"
    - "Meglio cera, gel o pomata?"
    - "Che cosa mi metto sui capelli?"
  q_en:
    - "What product should I use?"
    - "Wax, gel or pomade?"
  a_it: "Per un effetto naturale e opaco: argilla o pasta. Per un effetto lucido e ordinato: pomata. Per tenuta forte: gel. Il barbiere le consiglia quello giusto per il suo taglio."
  a_en: "For a natural matte look: clay or paste. For a slick, shiny look: pomade. For strong hold: gel. The barber will recommend the right one for your cut."

- id: far_crescere
  cat: consigli
  q_it:
    - "Voglio far crescere i capelli, devo tagliarli?"
    - "Come faccio crescere i capelli lunghi?"
  q_en:
    - "I'm growing my hair out, should I still get cuts?"
  a_it: "Sì, anche mentre crescono conviene una spuntatina ogni 6-8 settimane: tiene la forma ordinata nelle fasi intermedie."
  a_en: "Yes, even while growing it out, a light trim every 6-8 weeks keeps the shape tidy through the awkward stages."

- id: ricci_cura
  cat: consigli
  q_it:
    - "Come gestisco i capelli ricci?"
    - "I miei ricci sono crespi"
  q_en:
    - "How do I manage curly hair?"
    - "My curls are frizzy"
  a_it: "Per i ricci: shampoo delicato, sempre il balsamo, asciugare tamponando senza strofinare, e una crema per ricci per tenere a bada il crespo."
  a_en: "For curls: gentle shampoo, always conditioner, pat dry without rubbing, and a curl cream to control frizz."

- id: cowlick
  cat: consigli
  q_it:
    - "Ho un ciuffo ribelle"
    - "Ho una rosa sulla nuca, i capelli stanno su"
  q_en:
    - "I have a cowlick"
  a_it: "Lo segnali al barbiere: tagliando nella direzione giusta e lasciando la lunghezza adatta, il ciuffo ribelle si gestisce molto meglio."
  a_en: "Point it out to the barber: cutting with the right direction and length makes a cowlick much easier to manage."

- id: asciugare
  cat: consigli
  q_it:
    - "Devo usare il phon?"
    - "Come asciugo i capelli corti?"
  q_en:
    - "Should I blow-dry my hair?"
  a_it: "Il phon a temperatura media aiuta a dare forma e volume; diriga l'aria nella direzione in cui vuole pettinarli."
  a_en: "A blow-dryer on medium heat helps with shape and volume; point the air in the direction you want to style."

- id: estate_corto
  cat: consigli
  q_it:
    - "In estate meglio corto?"
    - "Che taglio per l'estate?"
  q_en:
    - "Should I go shorter for summer?"
  a_it: "In estate molti scelgono lati più corti o una sfumatura: è più fresco e pratico, anche dopo il mare o la piscina."
  a_en: "In summer many people go for shorter sides or a fade: cooler and practical, even after the beach or pool."

- id: capelli_grassi
  cat: consigli
  q_it:
    - "Ho i capelli grassi"
    - "Mi si sporcano subito i capelli"
  q_en:
    - "My hair gets greasy quickly"
  a_it: "Usi uno shampoo per capelli grassi, eviti acqua troppo calda e prodotti molto lucidi; un prodotto opaco aiuta."
  a_en: "Use a shampoo for oily hair, avoid very hot water and shiny products; a matte product helps."

- id: capelli_secchi
  cat: consigli
  q_it:
    - "Ho i capelli secchi e sfibrati"
    - "Ho le doppie punte"
  q_en:
    - "My hair is dry, split ends"
  a_it: "Per capelli secchi: balsamo sempre, meno phon caldo e una spuntatina regolare per eliminare le doppie punte."
  a_en: "For dry hair: always use conditioner, less hot blow-drying, and regular trims to remove split ends."

- id: taglio_mantenimento
  cat: consigli
  q_it:
    - "Qual è un taglio che non devo pettinare?"
    - "Voglio un taglio comodo"
  q_en:
    - "What's a low-maintenance cut?"
  a_it: "Per non pensarci troppo: buzz cut, crew cut o crop corto. Si asciugano in fretta e stanno bene senza prodotto."
  a_en: "For low maintenance: buzz cut, crew cut or short crop. They dry quickly and look good without product."

- id: taglio_lavoro
  cat: consigli
  q_it:
    - "Che taglio per un colloquio?"
    - "Voglio un taglio elegante per il lavoro"
  q_en:
    - "What cut for a job interview?"
    - "A professional cut?"
  a_it: "Per un look professionale va benissimo un taglio classico ordinato, con lati corti o una sfumatura leggera e la riga di lato."
  a_en: "For a professional look, a neat classic cut works perfectly: short sides or a light fade with a side part."

- id: numeri_macchinetta
  cat: consigli
  q_it:
    - "Che numero di macchinetta mi faccio?"
    - "Cosa vuol dire numero 2?"
    - "Quanto è corto lo zero?"
  q_en:
    - "What clipper guard number should I get?"
  a_it: "Indicativamente: lo 0 è quasi rasato (circa 0,5-1 mm), l'1 è 3 mm, il 2 è 6 mm, il 3 è 9 mm, il 4 è 12 mm. Il barbiere le mostra la differenza."
  a_en: "Roughly: 0 is almost shaved (about 0.5-1 mm), 1 is 3 mm, 2 is 6 mm, 3 is 9 mm, 4 is 12 mm. The barber can show you."

- id: differenza_fade
  cat: consigli
  q_it:
    - "Che differenza c'è tra low fade e high fade?"
    - "Cos'è il taper?"
  q_en:
    - "What's the difference between low and high fade?"
    - "What's a taper?"
  a_it: "Il low fade parte basso, sopra le orecchie; il mid a metà; l'high in alto, vicino alle tempie. Il taper sfuma solo basette e nuca, più discreto."
  a_en: "A low fade starts just above the ears, a mid fade halfway up, a high fade near the temples. A taper only fades the sideburns and neckline, more subtle."

- id: taglio_rovinato
  cat: consigli
  q_it:
    - "Un altro barbiere mi ha rovinato il taglio, potete sistemarlo?"
    - "Mi sono tagliato da solo e ho fatto un disastro"
  q_en:
    - "Can you fix a bad haircut?"
  a_it: "Di solito sì, si può sistemare! Prenoti un taglio e il barbiere vede cosa si può fare con la lunghezza rimasta."
  a_en: "Usually yes, it can be fixed! Book a cut and the barber will see what can be done with the length left."

- id: tagliarsi_da_solo
  cat: consigli
  q_it:
    - "Posso sistemarmi il collo da solo tra un taglio e l'altro?"
  q_en:
    - "Can I tidy my neckline myself between cuts?"
  a_it: "Sì, con un regolabarba si può ripulire la nuca sotto la linea esistente; meglio non risalire, per non alzare la sfumatura."
  a_en: "Yes, with a trimmer you can tidy below the existing neckline; just don't go higher, or you'll raise the fade."

- id: sole_mare
  cat: consigli
  q_it:
    - "Il sole rovina i capelli?"
    - "Come proteggo i capelli al mare?"
  q_en:
    - "Does the sun damage hair?"
  a_it: "Sole, sale e cloro seccano i capelli: un risciacquo con acqua dolce dopo il bagno e un balsamo aiutano molto."
  a_en: "Sun, salt and chlorine dry hair out: rinsing with fresh water after swimming and using conditioner helps a lot."

- id: capelli_bagnati
  cat: consigli
  q_it:
    - "Tagliate a capelli bagnati o asciutti?"
  q_en:
    - "Do you cut hair wet or dry?"
  a_it: "Dipende dal taglio: le sfumature spesso si fanno a capelli asciutti, i tagli a forbice spesso a capelli umidi. Decide il barbiere in base al risultato."
  a_en: "It depends on the cut: fades are often done dry, scissor cuts often damp. The barber chooses based on the result."

- id: taglio_tendenza
  cat: consigli
  q_it:
    - "Qual è il taglio di moda adesso?"
    - "Che tagli vanno quest'anno?"
  q_en:
    - "What's the trendy cut right now?"
  a_it: "Vanno molto il textured crop, le sfumature basse, il mullet moderno e i tagli medi con movimento naturale. Il barbiere le dice quale sta meglio a lei."
  a_en: "Popular right now: textured crops, low fades, the modern mullet and medium cuts with natural movement. The barber will tell you which suits you."

- id: crescita_capelli
  cat: consigli
  q_it:
    - "Quanto crescono i capelli in un mese?"
    - "Fra quanto ricrescono?"
    - "Ho tagliato troppo corto, quando ricrescono?"
  q_en:
    - "How fast does hair grow?"
    - "How long until it grows back?"
  a_it: "I capelli crescono in media circa 1-1,5 cm al mese: un taglio troppo corto di solito torna a posto in 2-4 settimane."
  a_en: "Hair grows on average about 1-1.5 cm a month: a cut that's too short usually looks normal again in 2-4 weeks."

